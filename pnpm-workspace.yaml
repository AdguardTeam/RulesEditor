# AG-54210
# minimumReleaseAge is in minutes; 10080 = 7 days.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@adguard/*'
# AG-54318
# Pin @adguard/scriptlets to 1.11.27 to avoid regex patterns introduced in
# 1.12.1 that are incompatible with Sciter's JavaScript engine.
overrides:
  '@adguard/scriptlets': '1.11.27'
