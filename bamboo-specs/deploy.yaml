---
version: 2
deployment:
  name: AdGuard Rules Editor - deploy
  source-plan: AJL-RULESEDITORBUILD
release-naming: ${bamboo.buildNumber}

environments:
  - npmjs
  - npmjs • alpha

npmjs: &npmjs
  variables: &npmjs-variables
    publishArgs: --access public
  docker:
    image: adguard/node-ssh:22.22--0
    volumes:
      ${system.PNPM_DIR}: ${bamboo.cachePnpm}
  triggers: []
  tasks:
    - checkout:
        force-clean-build: true
    - artifact-download:
        artifacts:
          - name: rules-editor.tgz
    - script:
        interpreter: SHELL
        scripts:
          - |-
            set -e
            set -x

            # Fix mixed logs
            exec 2>&1

            ls -alt

            # Publish tarball to NPM package registry
            export NPM_TOKEN=${bamboo.npmSecretToken}
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
            npm publish rules-editor.tgz $bamboo_publishArgs
  requirements:
    - extension: 'true'

npmjs • alpha:
  <<: *npmjs
  variables:
    <<: *npmjs-variables
    publishArgs: --tag alpha --access public
